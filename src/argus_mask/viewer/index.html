<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>argus-mask</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; }
  body.transparent { background: transparent; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #9aa4b2; opacity: .75; white-space: pre; pointer-events: none; }
  #notice { position: fixed; inset: 0; z-index: 11; display: none; place-items: center; text-align: center; padding: 24px;
            font: 16px/1.5 system-ui, sans-serif; color: #e6e9ee; background: rgba(8, 10, 14, .72); }
  #notice.show { display: grid; }
  #notice button { margin-top: 14px; font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid #5b6472; background: #1c2129; color: inherit; cursor: pointer; }
  /* one tap or key press: sound on, full screen */
  #start { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; text-align: center; cursor: pointer;
           font: 18px/1.5 system-ui, sans-serif; color: #e6e9ee; background: rgba(8, 10, 14, .78); }
  #start.show { display: grid; }
  #start b { display: block; font-size: 34px; margin-bottom: 6px; }
  #start span { color: #9aa4b2; }
  /* connected, and heard: said briefly, then out of the way */
  #ready { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
           font: 15px/1 system-ui, sans-serif; color: #e6e9ee; background: rgba(20, 60, 36, .85); opacity: 0;
           transition: opacity .6s; pointer-events: none; }
  #ready.show { opacity: 1; }
  body.kiosk, body.kiosk * { cursor: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/examples/jsm/": "./vendor/", "jszip": "./vendor/jszip.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="notice"><div><div id="notice-text"></div><button id="notice-button" hidden></button></div></div>
<div id="start" role="button" tabindex="0"><div><b>Tap to start</b><span>Sound needs one tap or key press. The face then fills the screen.</span></div></div>
<div id="ready" aria-live="polite">● Ready</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
