<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>argus-mask guided heads</title>
<style>
  :root { --bg: #101216; --panel: #171a20; --raised: #1d2128; --line: #2a303a; --text: #e6e9ee; --dim: #9aa4b2;
          --accent: #6ea8fe; --bad: #f28b82; --warn: #f6c177; --good: #8bd5a0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  a.nav { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.nav:hover { text-decoration: underline; }
  #status { flex: 1 1 160px; color: var(--dim); font-size: 12px; min-height: 1.4em; }
  #status.bad { color: var(--bad); }
  input, select, textarea { padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; font: inherit; width: 100%; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #5b6472; background: var(--raised); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.on { border-color: var(--accent); color: var(--accent); }
  label { display: grid; gap: 4px; color: var(--dim); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .hint { font-size: 12px; color: var(--dim); }
  .err { color: var(--bad); font-size: 13px; }

  main { padding: 16px; display: grid; gap: 14px; max-width: 1280px; margin: 0 auto; }
  #picker { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  #picker h2 { margin: 0; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  #build-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .build-chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px;
                border: 1px solid var(--line); background: var(--raised); cursor: pointer; font: inherit; color: inherit; }
  .build-chip.on { border-color: var(--accent); }
  .build-chip .id { font-family: ui-monospace, monospace; font-size: 12px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.good { color: var(--good); border-color: #2f5a3c; }
  .badge.warn { color: var(--warn); border-color: #5c4a2a; }
  .badge.bad { color: var(--bad); border-color: #6a3330; }
  .badge.stale { color: var(--warn); border-color: #5c4a2a; }

  #workspace[hidden] { display: none !important; }
  #candidates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .step > h2 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .step .about { margin: 0; color: var(--dim); font-size: 13px; }
  .checks { display: grid; gap: 6px; }
  .check { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 6px 8px;
           background: var(--bg); border-radius: 8px; border: 1px solid transparent; }
  .check.advisory { border-color: #5c4a2a; }
  .check.refused, .check.failed, .check.not_checked { border-color: #6a3330; }
  .check .name { font-family: ui-monospace, monospace; font-size: 12px; }
  .check .reason { color: var(--dim); font-size: 12px; }
  .scores { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--dim); }
  .scores b { color: var(--text); font-weight: 600; }
  .arts { display: flex; flex-wrap: wrap; gap: 8px; }
  .arts img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .blockers { color: var(--warn); font-size: 13px; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  form.stack { display: grid; gap: 8px; max-width: 520px; }
  form.stack .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  details summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  .records { display: grid; gap: 6px; max-height: 220px; overflow: auto; }
  .records button { text-align: left; width: 100%; }

  #pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .pick-card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
  .pick-card.ready { border-color: #2f5a3c; }
  .pick-card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pick-card .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pick-card .stage { aspect-ratio: 5 / 6; background: #0a0c10; border-radius: 8px; overflow: hidden; position: relative; min-height: 220px; }
  .pick-card .stage canvas, .pick-card .stage > div { display: block; width: 100%; height: 100%; }
  .pick-card .poses { display: flex; flex-wrap: wrap; gap: 6px; }
  .portrait-row { display: flex; gap: 8px; align-items: center; }
  .portrait-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--raised); }
  .job { font-size: 12px; color: var(--dim); }
  @media (max-width: 700px) { .check { grid-template-columns: 1fr; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/examples/jsm/": "./vendor/", "jszip": "./vendor/jszip.js" } }</script>
</head>
<body>
<header>
  <h1>Guided heads</h1>
  <a class="nav" href="./">← Editor</a>
  <a class="nav" href="./faces.html">Saved faces</a>
  <a class="nav" href="./broadcast.html">Broadcast</a>
  <a class="nav" href="./voices.html">Voices</a>
  <a class="nav" href="./packs.html">Asset packs</a>
  <div id="status" role="status" aria-live="polite"></div>
</header>

<main>
  <section id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title">Builds</h2>
    <p class="hint">Each build keeps its own record. The page only shows what the record says.</p>
    <div id="build-list" role="list"></div>
    <form id="create" class="row" aria-label="Create a guided build">
      <label>Id<input id="new-id" name="id" required pattern="[a-z0-9][a-z0-9_\-]{0,63}" maxlength="64" placeholder="e.g. holly-v1"></label>
      <label>Name<input id="new-name" name="name" maxlength="80" placeholder="optional"></label>
      <button type="submit" class="primary">Create</button>
    </form>
  </section>

  <div id="workspace" hidden>
    <div class="row">
      <h2 id="build-title" style="margin:0;font-size:16px;flex:1"></h2>
      <button type="button" id="refresh" class="small">Refresh</button>
    </div>
    <div id="candidates" role="tablist" aria-label="Candidates"></div>
    <div id="steps"></div>
  </div>
</main>

<script type="module" src="./guided.js"></script>
</body>
</html>
