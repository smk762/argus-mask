<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>argus-mask face editor</title>
<style>
  :root { --bg: #101216; --panel: #171a20; --raised: #1d2128; --line: #2a303a; --text: #e6e9ee; --dim: #9aa4b2;
          --accent: #6ea8fe; --bad: #f28b82; --warn: #f6c177; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }

  /* top bar */
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 6px 0; white-space: nowrap; }
  header label { display: grid; gap: 3px; color: var(--dim); font-size: 12px; }
  header .grow { flex: 1 1 120px; }
  a.nav { color: var(--accent); text-decoration: none; font-size: 13px; margin: 0 8px 8px 0; white-space: nowrap; }
  a.nav:hover { text-decoration: underline; }
  #status { flex: 2 1 120px; color: var(--dim); font-size: 12px; align-self: center; min-height: 1.4em; }
  #status.bad, #banner { color: var(--bad); }
  #banner { padding: 8px 16px; background: #2a1517; border-bottom: 1px solid var(--line); }
  input[type=text], input[type=search], select { padding: 6px 8px; background: var(--bg); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; font: inherit; min-width: 0; width: 100%; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid #5b6472; background: var(--raised); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  button:disabled { opacity: .5; cursor: progress; }

  /* layout: panels fill the width; the preview is a card beside them */
  main { display: grid; grid-template-columns: 1fr 300px; gap: 14px; padding: 14px 16px 40px; align-items: start; }
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; align-items: start; }
  aside { position: sticky; top: 76px; display: grid; gap: 8px; max-height: calc(100vh - 90px); overflow-y: auto; }
  .history { display: flex; align-items: center; gap: 6px; }
  .history span { color: var(--dim); font-size: 12px; margin-left: auto; }
  .card .tag { padding: 6px 10px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .card .tag span { text-transform: none; letter-spacing: 0; opacity: .8; }
  #before { position: relative; aspect-ratio: 1; cursor: zoom-in; background: var(--bg); }
  #before canvas { display: block; width: 100%; height: 100%; }
  #before .empty { background: var(--bg); }  /* over the stale canvas when a build has left the cache */
  #diff div { color: var(--text); }
  #diff .from { color: var(--dim); }
  .stages { display: grid; grid-template-columns: 1fr; min-height: 0; }
  .stages.two { grid-template-columns: 1fr 1fr; gap: 2px; }
  .pane { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .pane .tag { padding: 4px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .pane > #stage, .pane > #stage-b { min-height: 0; position: relative; }
  #stage-b canvas { display: block; width: 100%; height: 100%; }

  details.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  details.panel > summary { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; list-style: none; user-select: none; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before { content: '▸'; color: var(--dim); transition: transform .15s; }
  details.panel[open] > summary::before { transform: rotate(90deg); }
  details.panel > summary .title { font-weight: 600; flex: 1; }
  details.panel > summary .count { color: var(--warn); font-size: 12px; }
  details.panel > .body { padding: 2px 12px 12px; }

  label.row { display: grid; grid-template-columns: minmax(90px, 36%) 1fr 92px; align-items: center; gap: 8px; margin: 3px 0; }
  label.row > span { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label.row.changed > span { color: var(--warn); }
  label.row output { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 5px; }
  .tile { border: 2px solid transparent; border-radius: 8px; background: var(--bg); padding: 2px; cursor: pointer; color: var(--dim); font-size: 10.5px; text-align: center; }
  .tile img, .tile .none { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; display: grid; place-items: center; background: #222; }
  .tile.on { border-color: var(--accent); color: var(--text); }
  .tile:hover, .tile:focus-visible { border-color: #5b6472; outline: none; }
  .tile.on:hover { border-color: var(--accent); }
  .tile span { display: block; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }

  /* the enlarged thumbnail shown on hover in the skin, hair, clothes and hat panels */
  #peek { position: fixed; z-index: 30; width: 268px; padding: 6px; background: var(--raised); border: 1px solid var(--line);
          border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55); pointer-events: none; }
  #peek img { display: block; width: 256px; height: 256px; object-fit: contain; border-radius: 8px; background: #222; }
  #peek .cap { padding: 6px 4px 2px; font-size: 12px; color: var(--dim); }
  #peek .cap b { display: block; color: var(--text); font-size: 13px; font-weight: 600; }

  /* preview */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #thumb { position: relative; aspect-ratio: 1; cursor: zoom-in; background: var(--bg); }
  #thumb canvas, #stage canvas { display: block; width: 100%; height: 100%; }
  #thumb .empty, #before .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--dim); font-size: 13px; cursor: default; }
  #thumb .zoom { position: absolute; right: 8px; top: 8px; font-size: 12px; color: var(--dim); background: rgba(0,0,0,.4); border-radius: 6px; padding: 2px 6px; }
  .meta { padding: 8px 10px; font-size: 12px; color: var(--dim); display: grid; gap: 4px; }
  .meta .stale { color: var(--warn); }
  /* a build in progress: the face fades, a spinner counts */
  #thumb, #stage { position: relative; }
  #thumb canvas, #stage canvas { transition: opacity .25s, filter .25s; }
  .building canvas { opacity: .3; filter: blur(3px) grayscale(.4); }
  .busy { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 6px;
          color: var(--text); font-size: 13px; pointer-events: none; }
  .busy .t { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .busy .bar { width: 140px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .busy .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
          animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  label.toggle { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; white-space: nowrap; align-self: center; cursor: pointer; }
  label.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .meta .live { color: #8bd5a0; }
  .meta .name { color: var(--text); font-weight: 600; }

  /* the large view */
  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 9, .88); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  #modal .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--dim); font-size: 12px; }
  #modal .top .name { color: var(--text); font-weight: 600; font-size: 14px; }
  #modal .top .spacer { flex: 1; }
  #stage { min-height: 0; }
  .poses { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px; }
  .poses button.on { border-color: var(--accent); }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; order: -1; grid-template-columns: 140px 1fr; }
  }
  @media (hover: none) { #peek { display: none !important; } }
</style>
<script src="./qr/qrcode.js"></script>  <!-- qrcode-generator 1.4.4, MIT: QR codes for screen links -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<form id="form" autocomplete="off">
  <header>
    <h1>Face editor</h1>
    <a class="nav" href="./faces.html">Saved faces →</a>
    <a class="nav" href="./broadcast.html">Broadcast →</a>
    <label class="grow">Start from<select id="start"></select></label>
    <label class="grow">Id<input type="text" id="id" pattern="[a-z0-9][a-z0-9_\-]{0,63}" required></label>
    <label class="grow">Name<input type="text" id="name" maxlength="80" required></label>
    <label class="grow">Filter<input type="search" id="filter" placeholder="nose, lip, hair…"></label>
    <span id="status"></span>
    <label class="toggle" title="Build by itself a moment after each change"><input type="checkbox" id="live"> Live update</label>
    <button type="button" id="open" title="Open a preset .json file into the form">Open…</button>
    <input type="file" id="open-file" accept=".json,application/json" hidden>
    <button type="button" id="download" title="Download the form as a preset .json file">Download</button>
    <button type="button" id="export" disabled title="Copy the preview into assets/, where the server serves it">Export</button>
    <button type="button" id="onscreen" disabled title="Open the exported face on a screen, and check it is ready to speak">On screen…</button>
    <button type="submit" class="primary" id="build" title="Build a preview (Ctrl+Enter)">Build</button>
  </header>
  <div id="banner" hidden></div>
  <main>
    <div id="panels"></div>
    <aside>
      <div class="history" id="history">
        <button type="button" class="small" id="undo" disabled title="Back to the build before this one (Ctrl+Z)">↶ Undo</button>
        <button type="button" class="small" id="redo" disabled title="Forward again (Ctrl+Shift+Z)">Redo ↷</button>
        <span id="hist-pos"></span>
      </div>
      <div class="card">
        <div class="tag">Now</div>
        <div id="thumb" title="Open the large view">
          <div class="empty" id="empty">No build yet.<br>Choose, then Build: about ten seconds.</div>
          <div class="busy" hidden><div class="spin"></div><b>Building</b><span class="t"></span><div class="bar"><i></i></div></div>
          <span class="zoom" hidden>⤢ enlarge</span>
        </div>
        <div class="meta" id="meta" hidden></div>
      </div>
      <div class="card" id="before-card" hidden>
        <div class="tag">Before <span>the build before this one</span></div>
        <div id="before" title="Compare in the large view"><div class="empty" id="before-empty" hidden></div></div>
        <div class="meta" id="diff"></div>
      </div>
    </aside>
  </main>
</form>
<div id="peek" hidden aria-hidden="true"><img alt=""><div class="cap"></div></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Preview">
  <div class="top"><span class="name" id="modal-name"></span><span id="modal-credits"></span><span class="spacer"></span>
    <button type="button" class="small" id="close">Close (Esc)</button></div>
  <div class="stages" id="stages">
    <div class="pane" id="pane-b" hidden><div class="tag">Before</div><div id="stage-b"></div></div>
    <div class="pane"><div class="tag" id="tag-now" hidden>Now</div>
      <div id="stage"><div class="busy" hidden><div class="spin"></div><b>Building</b><span class="t"></span><div class="bar"><i></i></div></div></div></div>
  </div>
  <div class="poses" id="poses"></div>
</div>
<script type="module" src="./editor.js"></script>
</body>
</html>
