# argus-mask: the server and its bundled viewer, and optionally the Audio2Face server that drives it.
# A TTS service and the TLS proxy run elsewhere and are reached by URL (see .env.example).
#
#   cp .env.example .env   # then edit
#   docker compose up --build                  # mask alone, with the driver named in .env
#   docker compose --profile a2f up --build    # mask and the Audio2Face server (needs an NVIDIA GPU)
#
# Published on 127.0.0.1 only by default. To serve screens on the LAN, set MASK_PUBLISH to an
# address your TLS proxy can reach and name the proxy's origin in CORS_ORIGINS; a screen that opens the
# server by a host name needs that name in TRUSTED_HOSTS.
#
# The a2f image is built here and not published. Its first build downloads about 5.5 GB and needs
# about 25 GB free in Docker's data directory; see a2f/README.md.

services:
  mask:
    image: ghcr.io/smk762/argus-mask:${MASK_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${MASK_PUBLISH:-127.0.0.1:8109}:8109"
    # How argus-iris's node agent finds this service for the suite directory (argus-cortex's service labels).
    labels:
      argus.peer: mask
      argus.service: argus-mask
      argus.health: /health
      argus.port: "8109"
    environment:
      ARGUS_PEER: mask  # the argus.peer label, for /health: a process cannot read its own labels
      ARGUS_MASK_DRIVER: ${DRIVER:-energy}
      ARGUS_MASK_A2F_URL: ${A2F_URL:-}
      ARGUS_MASK_FPS: ${FPS:-30}
      ARGUS_MASK_CORS_ORIGINS: ${CORS_ORIGINS:-}
      ARGUS_MASK_TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      ARGUS_MASK_READ_ONLY: ${READ_ONLY:-0}
      ARGUS_MASK_TTS_URL: ${TTS_URL:-}
      ARGUS_MASK_TTS_VOICE: ${TTS_VOICE:-}
      # argus-iris, the suite's GPU broker (see .env.example): the URL and token are all it takes, and mask
      # registers /app/gpu-tenant.yaml at startup. The token stays in the host's .env.
      # A blank value here falls through to the suite file, when one is mounted below.
      ARGUS_GPU_COORDINATOR: ${ARGUS_GPU_COORDINATOR:-}
      ARGUS_GPU_BROKER_URL: ${ARGUS_GPU_BROKER_URL:-}
      ARGUS_GPU_BROKER_TOKEN: ${ARGUS_GPU_BROKER_TOKEN:-}
      ARGUS_GPU_BROKER_FALLBACK: ${ARGUS_GPU_BROKER_FALLBACK:-lease}
    volumes:
      - ${ASSETS_DIR:-./assets}:/assets:ro
      # The suite file: settings every Argus service on this host shares (the broker URL and token, peer URLs).
      # Commented out because compose cannot skip a bind mount whose file is missing (Docker would create a
      # directory in its place). Uncomment on a host that has one; it must belong to root, or to the user the
      # container runs as, and be mode 600 (root-owned may be 444).
      # - ${ARGUS_SUITE_ENV:-${HOME}/.config/argus/suite.env}:/etc/argus/suite.env:ro
    extra_hosts:
      # Reach services on the host the same way on Linux as on Docker Desktop.
      - "host.docker.internal:host-gateway"

  # With this profile on, set DRIVER=a2f and A2F_URL=http://a2f:8110 in .env.
  a2f:
    profiles: ["a2f"]
    build: ./a2f
    image: argus-mask-a2f:${A2F_TAG:-dev}
    restart: unless-stopped
    ports:
      # For `argus-mask drive` on the host. Mask's container reaches it as http://a2f:8110. For argus-iris to see
      # it (the a2f resident in gpu-tenant.yaml), publish it on an address the broker can reach.
      - "${A2F_PUBLISH:-127.0.0.1:8110}:8110"
    environment:
      A2F_MODEL: ${A2F_MODEL:-james}
      A2F_GPU_SOLVER: ${A2F_GPU_SOLVER:-0}
    volumes:
      # The downloaded model and the TensorRT engine built for this host's card.
      - a2f-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  a2f-data:
