[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-mask"
dynamic = ["version"]
description = "A talking face for the Argus suite: audio in, facial animation frames out, rendered in a browser on any screen on the LAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # wire-schema versioning (argus_cortex.wire) and the /health VRAM probe (argus_cortex.gpu).
    # Capped below the next minor: argus-cortex is pre-1.0, where a minor bump may break.
    "argus-cortex>=0.4.6,<0.5",
    "pydantic>=2.0",
    "numpy>=1.26",
    # Streaming resampler: whatever rate the source sends, the driver gets 16 kHz.
    "soxr>=0.5",
    "structlog>=24.0",
]

[project.optional-dependencies]
# websockets: uvicorn serves no WebSocket route without a protocol library installed.
# argus-cortex[server]: the shared cross-site write guard and env_flag (argus_cortex.server).
# argus-cortex[gpu]: NVML, for the free-VRAM figure on /health. Mask's own process uses no GPU.
server = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=15.0", "argus-cortex[server,gpu]>=0.4.6,<0.5"]
# websockets: `push` and `say` are clients of a running server's source socket.
cli = ["typer>=0.12", "rich>=13.0", "websockets>=15.0"]
# The client of the Audio2Face server (a2f/), which is reached over a WebSocket.
a2f = ["websockets>=15.0"]
# `record` renders a session to a video in a headless browser (playwright, plus `playwright install
# chromium-headless-shell` once) and muxes it with ffmpeg: the one on PATH, else imageio-ffmpeg's.
record = ["argus-mask[cli]", "playwright>=1.49", "imageio-ffmpeg>=0.5"]
all = ["argus-mask[server,cli,a2f,record]"]
# httpx2 backs starlette's TestClient: starlette >=1.3 deprecated the httpx path
# and raises when neither client is installed, so testing the server needs it.
dev = ["argus-mask[server,cli,a2f]", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "httpx2>=2.7"]

[project.scripts]
argus-mask = "argus_mask.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-mask"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_mask/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_mask"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_mask/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
